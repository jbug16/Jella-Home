# Verify (no e2e / no local Supabase)

# Catches install, format, lint, typecheck, and unit-test failures on PRs and
# pushes. Staging Netlify also runs these checks before build. Playwright and
# pgTAP remain local (see docs/DEPLOYMENT.md).

name: verify

on:
  pull_request:
  push:
    branches:
      - staging
      - main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
